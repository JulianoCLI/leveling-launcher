syntax = "proto3";

package leveling.v1;

enum EnchantBatchStop {
  ENCHANT_BATCH_STOP_UNSPECIFIED = 0;
  ENCHANT_BATCH_STOP_TARGET = 1;
  ENCHANT_BATCH_STOP_MAX = 2;
  ENCHANT_BATCH_STOP_ATTEMPTS = 3;
  ENCHANT_BATCH_STOP_STONES = 4;
  ENCHANT_BATCH_STOP_GOLD = 5;
}

enum InsigniaExchange {
  INSIGNIA_EXCHANGE_UNSPECIFIED = 0;
  INSIGNIA_EXCHANGE_MARSHAL = 1;
  INSIGNIA_EXCHANGE_CORE = 2;
}

message Enchant {
  uint64 uid = 1;
  uint32 expected_level = 2;
}

message EnchantResult {
  uint64 uid = 1;
  bool success = 2;
  uint32 from_level = 3;
  uint32 to_level = 4;
  uint32 target_level = 5;
  uint64 gold_cost = 6;
  bool downgraded = 7;
  ItemInstance item = 8;
}

message EnchantBatch {
  uint64 uid = 1;
  uint32 expected_level = 2;
  uint32 target_level = 3;
  uint32 attempts = 4;
  bool repeat_until_target = 5;
}

message EnchantBatchResult {
  uint64 uid = 1;
  uint32 from_level = 2;
  uint32 to_level = 3;
  uint32 target_level = 4;
  uint32 attempts = 5;
  uint32 successes = 6;
  uint32 failures = 7;
  uint64 stones_spent = 8;
  uint64 gold_spent = 9;
  EnchantBatchStop stop_reason = 10;
  ItemInstance item = 11;
}

message SocketGem {
  uint64 item_uid = 1;
  uint32 socket = 2;
  uint64 gem_uid = 3;
}

message SocketGemResult {
  ItemInstance item = 1;
