}

message ExpeditionActive {
  uint32 id = 1;
  string gate = 2;
  string difficulty = 3;
  uint32 minutes = 4;
  int64 started_at_ms = 5;
  int64 ends_at_ms = 6;
  double power = 7;
  double recommended = 8;
  double chance = 9;
