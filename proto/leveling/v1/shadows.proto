}

message ExpeditionReport {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCESS = 1;
    OUTCOME_FOUND = 2;
    OUTCOME_FAILED = 3;
  }

  uint32 id = 1;
  string gate = 2;
  string difficulty = 3;
  uint32 minutes = 4;
  ExpeditionReport.Outcome outcome = 5;
  uint32 potions = 8;
  uint32 revives = 9;
  uint32 stones = 13;
  repeated Shadow shadows = 10;
}

message ExpeditionSend {
  string gate = 1;
  string difficulty = 2;
  uint32 minutes = 3;
  repeated uint64 uids = 4;
  bool simulate = 5;
}

message ExpeditionRequest {

  oneof op {
    bool panel = 1;
    ExpeditionSend send = 2;
    uint32 collect = 3;
    uint32 cancel = 4;
    bool collect_all = 6;
    bool finish_now = 7;
  }
}

message ExpeditionResult {
