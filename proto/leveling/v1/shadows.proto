  bool enabled = 1;
  repeated ExpeditionDestination destinations = 2;
  repeated uint32 durations = 3;
  repeated uint32 vip_durations = 4;
  uint32 slots = 5;
  uint32 squad_max = 6;
  bool vip = 7;
  repeated ExpeditionActive active = 8;
  repeated ExpeditionCandidate candidates = 9;
  uint32 collected = 11;
  uint32 succeeded = 12;
  int64 now_ms = 13;
  uint32 vip_slots = 14;
  uint32 level_extra_slot = 15;
  uint32 squad_max_vip = 16;
  bool dev_tools = 18;
  uint32 access = 19;
  bool sending_open = 20;
  uint32 min_level = 21;
}

message ExpeditionPlan {
  double power = 1;
  double recommended = 2;
  double ratio = 3;
  double chance = 4;
  double base_chance = 5;
  uint32 minutes_real = 11;
  double stones = 22;
  uint32 potions = 15;
  double find_chance = 16;
  double fail_share = 17;
