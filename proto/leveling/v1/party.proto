message PartyRequest {

  oneof op {
    PartyGet get = 1;
    PartyInviteByName invite = 2;
    PartyAnswer answer = 3;
    PartyLeave leave = 4;
    PartyKick kick = 5;
    PartySetRole set_role = 6;
    PartyPromote promote = 7;
    PartyList list = 8;
    PartyJoin join = 9;
    PartyJoinCancel join_cancel = 10;
    PartyJoinAnswer join_answer = 11;
    PartySetTargetMode set_target_mode = 12;
    PartyUpdateSettings update_settings = 13;
