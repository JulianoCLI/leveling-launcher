syntax = "proto3";

package leveling.v1;

enum PartyPlace {
  PARTY_PLACE_UNKNOWN = 0;
  PARTY_PLACE_CITY = 1;
  PARTY_PLACE_HUNT = 2;
  PARTY_PLACE_BOSS = 3;
  PARTY_PLACE_ARENA = 4;
}

enum PartyPrivacy {
