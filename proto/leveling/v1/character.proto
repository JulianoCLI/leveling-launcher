}

message Points {
  uint32 stat_points = 1;
  uint32 talent_points = 2;
  uint32 shadow_talent_points = 3;
  uint32 ambition_talent_points = 4;
}

message StatsState {
  repeated StatAmount allocated = 1;
  repeated StatAmount class_base = 2;
  repeated StatAmount total = 3;
  StatSources sources = 4;
  RespecCost respec_cost = 7;
  uint32 free_respecs = 8;
  uint32 free_respec_below_level = 9;
