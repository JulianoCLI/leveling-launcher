  double equip_atk = 1;
  double equip_def = 2;
  double equip_hp = 3;
  map<string, double> gems = 4;
  SetBonusTotals sets = 5;
  repeated string active_sets = 6;
  map<string, double> talents = 7;
  CodexBonus codex = 8;
  map<string, double> affixes = 9;
}

message SetBonusTotals {
  double attack = 1;
  double defense = 2;
  double life = 3;
  double crit = 4;
  double crit_mult = 5;
  double penetration = 6;
