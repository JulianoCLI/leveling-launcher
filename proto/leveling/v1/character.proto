syntax = "proto3";

package leveling.v1;

enum RespecCost {
  RESPEC_COST_UNSPECIFIED = 0;
  RESPEC_COST_FREE = 1;
  RESPEC_COST_TOKEN = 2;
  RESPEC_COST_CRYSTAL = 3;
}

enum LootAction {
  LOOT_ACTION_UNSPECIFIED = 0;
  LOOT_ACTION_KEEP = 1;
  LOOT_ACTION_SELL = 2;
  LOOT_ACTION_DISMANTLE = 3;
  LOOT_ACTION_LIST = 4;
}

message MedalEarned {
  string id = 1;
  int64 at_ms = 2;
}

message Identity {
