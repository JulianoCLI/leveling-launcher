  Gender gender = 2;
  string skin_id = 3;
  repeated string owned_skins = 4;
  string aura_id = 5;
  string class_id = 6;
  bool class_change_available = 7;
  bool aura_unlocked = 8;
  uint32 hunter_rank = 9;
  repeated EquipSlot hidden_visuals = 10;
  bool hide_gear_stats = 11;
  repeated MedalEarned medals = 12;
  string medal_id = 13;
  string title_id = 14;
  string frame_id = 15;
  string background_id = 16;
  repeated string owned_cosmetics = 17;
  repeated MedalEarned trophies = 18;
  repeated string owned_looks = 19;
  repeated GearLook worn_looks = 20;
  map<string, uint32> cosmetic_variants = 21;
  HunterAppearance appearance = 22;
  repeated string owned_hair_styles = 23;
  repeated string ring_modes = 24;
  bool appearance_free_save = 25;
  repeated string pack_fx_off = 26;
  repeated string owned_chromas = 27;
  repeated LookChroma look_chromas = 28;
}

message LookChroma {
  string look_id = 1;
  string chroma_id = 2;
}

message SetLookChroma {
  string look_id = 1;
  string chroma_id = 2;
}

message BuyChroma {
  string chroma_id = 1;
}

message ChromaResult {
  repeated string owned_chromas = 1;
  repeated LookChroma look_chromas = 2;
  uint64 diamonds_spent = 3;
}

message GearLook {
  EquipSlot slot = 1;
  string look_id = 2;
}

message SetGearLook {
  EquipSlot slot = 1;
  string look_id = 2;
}

message SetGearLookResult {
  repeated string owned_looks = 1;
  repeated GearLook worn_looks = 2;
}

message SetGearPrivacy {
  repeated EquipSlot hidden_visuals = 1;
  bool hide_stats = 2;
}

message SetGearPrivacyResult {
  repeated EquipSlot hidden_visuals = 1;
  bool hide_stats = 2;
}

message Progress {
  uint32 level = 1;
  uint64 xp = 2;
  uint64 xp_to_next = 3;
  uint32 hp = 4;
  uint32 mana = 5;
  uint64 authority_milli = 6;
  uint64 banked_xp = 7;
  uint32 level_cap = 8;
