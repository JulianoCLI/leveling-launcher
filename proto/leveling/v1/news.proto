syntax = "proto3";

package leveling.v1;

message NewsBanner {
  int64 id = 1;
  int32 sort = 2;
  bool active = 3;
  map<string, string> title = 4;
  map<string, string> body = 5;
  map<string, string> button = 6;
  string image = 7;
  string action = 8;
  int64 starts_at_ms = 9;
  int64 ends_at_ms = 10;
  string audience = 11;
  uint32 min_level = 12;
  int64 updated_at_ms = 13;
  string article = 14;
  int64 notified_at_ms = 15;
  bool notify_open = 16;
}

message NewsList {
}

message NewsListResult {
  repeated NewsBanner banners = 1;
}

message NewsAdminList {
}

message NewsAdminListResult {
  repeated NewsBanner banners = 1;
}

message NewsAdminSave {
  NewsBanner banner = 1;
}

message NewsAdminDelete {
  int64 id = 1;
}

message NewsAdminReorder {
  repeated int64 ids = 1;
}

message NewsAdminUpload {
  bytes data = 1;
  string mime = 2;
}

message NewsAdminUploadResult {
  string image = 1;
}

message NewsAdminNotify {
  int64 id = 1;
  bool open = 2;
}

message NewsRequest {

  oneof op {
    NewsList list = 1;
    NewsAdminList admin_list = 10;
    NewsAdminSave admin_save = 11;
    NewsAdminDelete admin_delete = 12;
    NewsAdminReorder admin_reorder = 13;
    NewsAdminUpload admin_upload = 14;
    NewsAdminNotify admin_notify = 15;
  }
}

message NewsResponse {

  oneof result {
    NewsListResult list = 1;
    NewsAdminListResult admin_list = 10;
    NewsAdminUploadResult admin_upload = 14;
  }
}

message NewsPush {
  int64 changed_at_ms = 1;
  int64 banner_id = 2;
  bool open = 3;
}

