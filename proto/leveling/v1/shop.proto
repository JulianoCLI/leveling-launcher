syntax = "proto3";

package leveling.v1;

message BuyConsumable {
  ConsumableKind kind = 1;
  PotionTier tier = 2;
  uint32 qty = 3;
}

message BuyConsumableResult {
  ConsumableKind kind = 1;
  PotionTier tier = 2;
  uint32 qty = 3;
  uint64 gold_cost = 4;
  uint32 owned = 5;
}

message BuyEssence {
  uint32 qty = 1;
}

message BuyEssenceResult {
  uint32 qty = 1;
  uint64 gold_cost = 2;
}

message BuyMaterial {
  string offer_id = 1;
  uint32 packs = 2;
}

message BuyMaterialResult {
  string offer_id = 1;
  string item_def_id = 2;
  uint32 qty = 3;
  uint64 cost = 4;
  Currency currency = 5;
}

message BuyPremium {
  ShopCategory category = 1;
  string offer_id = 2;
  uint32 qty = 3;
}

message BuyPremiumResult {
  ShopCategory category = 1;
  string offer_id = 2;
  uint64 diamonds_spent = 3;
  uint64 diamonds = 4;
  int64 until_ms = 5;
}

message SetAura {
  string aura_id = 1;
  string ring_aura = 2;
  string ring_mode = 3;
  string pack_fx = 4;
  bool pack_fx_on = 5;
}

message SetAuraResult {
  string aura_id = 1;
  repeated string ring_modes = 2;
  repeated string pack_fx_off = 3;
}

