syntax = "proto3";

package leveling.v1;

message MissionRewardDef {
  uint32 essences = 1;
  uint32 hp_potions = 2;
  uint32 mana_potions = 3;
  double dust = 4;
  uint32 stones = 5;
  double gold_kills = 6;
}

message MissionReward {
  uint32 essences = 1;
  uint32 hp_potions = 2;
  uint32 mana_potions = 3;
  string potion_tier = 4;
  uint64 dust = 5;
  uint32 stones = 6;
  uint64 gold = 7;
}

message MissionGoal {
  string id = 1;
  string kind = 2;
  uint32 amount = 3;
  string target = 4;
  uint32 min_grade = 5;
  MissionRewardDef reward = 6;
}

message DailyBonusDef {
  string id = 1;
  double value = 2;
}

message MissionRules {
  repeated MissionGoal journey = 1;
  repeated MissionGoal daily_pool = 2;
  uint32 daily_count = 3;
  repeated DailyBonusDef bonuses = 4;
}

message JourneyState {
  uint32 step = 1;
  uint64 progress = 2;
  bool ready = 3;
  MissionReward reward = 4;
  bool finished = 5;
}

message DailyMissionState {
  string id = 1;
  string kind = 2;
  uint32 amount = 3;
  string target = 4;
  uint32 min_grade = 5;
  uint64 progress = 6;
  bool claimed = 7;
  MissionReward reward = 8;
}

message MissionsState {
  JourneyState journey = 1;
  repeated DailyMissionState daily = 2;
  int64 reset_at_ms = 3;
  string bonus_id = 4;
  double bonus_value = 5;
}

message MissionsClaimed {
  MissionsState state = 1;
  MissionReward reward = 2;
  bool mailed = 3;
}

message MissionsRequest {

  oneof op {
    bool state = 1;
    bool claim_journey = 2;
    string claim_daily = 3;
  }
}

message MissionsResponse {

  oneof result {
    MissionsState state = 1;
    MissionsClaimed claimed = 2;
  }
}

message MissionsPush {

  oneof event {
    MissionsState state = 1;
  }
}

